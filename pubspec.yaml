name: smartlib_frontend
description: SmartLib client — library lending and study-seat booking.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  dio: ^5.0.0
  cupertino_icons: ^1.0.8
  # Routing isn't used in Phase 1 (there's a single screen). Add it when Phase 2
  # introduces real navigation, so pub picks the version current at that time:
  #   flutter pub add go_router

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
