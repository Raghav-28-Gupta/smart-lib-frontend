name: smartlib_frontend
description: SmartLib client — library lending and study-seat booking.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  dio: ^5.0.0
  cupertino_icons: ^1.0.8
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  json_annotation: ^4.12.0
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.16.1
  json_serializable: ^6.14.1

flutter:
  uses-material-design: true
