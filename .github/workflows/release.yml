# Pushing a version tag (git tag v1.0.0 && git push origin v1.0.0) builds a
# signed Android APK pointed at the production backend and attaches it to a
# GitHub Release for that tag. (Windows is not released for now.)
#
# Needs (repo Settings -> Secrets and variables -> Actions):
#   Variable SMARTLIB_API_BASE_URL   the backend URL, e.g. https://smartlib-backend.onrender.com
#   Secret   ANDROID_KEYSTORE_BASE64 the upload keystore (.jks), base64-encoded
#   Secret   ANDROID_KEYSTORE_PASSWORD
#   Secret   ANDROID_KEY_ALIAS
#   Secret   ANDROID_KEY_PASSWORD
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - name: Check the release is configured
        env:
          API: ${{ vars.SMARTLIB_API_BASE_URL }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          missing=0
          [ -n "$API" ] || { echo "::error::Variable SMARTLIB_API_BASE_URL is not set"; missing=1; }
          [ -n "$KEYSTORE" ] || { echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set"; missing=1; }
          [[ "${GITHUB_REF_NAME#v}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Tag must look like v1.2.3"; missing=1; }
          exit $missing
      - run: flutter pub get
      - run: flutter test
      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
      - name: Build the APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          flutter build apk --release \
            --build-name="$VERSION" --build-number="${{ github.run_number }}" \
            --dart-define=SMARTLIB_API_BASE_URL="${{ vars.SMARTLIB_API_BASE_URL }}"
          mv build/app/outputs/flutter-apk/app-release.apk "SmartLib-$VERSION.apk"
      # Without android/key.properties the build silently falls back to the
      # debug key. Such an APK can never be updated by a properly signed one.
      - name: Refuse a debug-signed APK
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs SmartLib-*.apk | tee certs.txt
          if grep -q "CN=Android Debug" certs.txt; then
            echo "::error::The APK is signed with the debug key"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: SmartLib-*.apk

  publish:
    needs: [android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" artifacts/*
          --repo "$GITHUB_REPOSITORY"
          --title "SmartLib $GITHUB_REF_NAME"
          --generate-notes
